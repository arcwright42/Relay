[package]
name = "relay-platform"
description = "macOS desktop, microphone, and local wake detection boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
relay-core.workspace = true
async-channel.workspace = true
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cpal.workspace = true
objc2-av-foundation.workspace = true
sherpa-onnx.workspace = true

# Native FFI is confined to this package; all other packages forbid unsafe code.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
