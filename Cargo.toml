[workspace]
members = ["crates/relay", "crates/relay-core", "crates/relay-ui", "xtask"]
exclude = ["vendor/gpui-pre"]
default-members = ["crates/relay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
gpui-kit = "=0.6.6"
relay-core = { path = "crates/relay-core", version = "=0.1.0" }
relay-ui = { path = "crates/relay-ui", version = "=0.1.0" }
serde_json = "=1.0.151"

# Keep Inspector controls clickable while selecting an element; see vendor/README.md.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = 1

[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.gpui-component]
opt-level = 2

[profile.release]
lto = "thin"
strip = "debuginfo"
