[workspace]
members = ["crates/relay", "crates/relay-core", "crates/relay-ui", "crates/relay-runtime", "crates/relay-acp", "xtask", "crates/relay-platform"]
exclude = ["vendor/gpui-pre"]
default-members = ["crates/relay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
agent-client-protocol = { version = "=2.2.0", features = ["unstable_end_turn_token_usage"] }
anyhow = "=1.0.104"
async-channel = "=2.5.0"
async-io = "=2.6.0"
futures-lite = "=2.6.1"
gpui-kit = "=0.6.6"
relay-acp = { path = "crates/relay-acp", version = "=0.1.0" }
relay-core = { path = "crates/relay-core", version = "=0.1.0" }
relay-runtime = { path = "crates/relay-runtime", version = "=0.1.0" }
relay-platform = { path = "crates/relay-platform", version = "=0.1.0" }
relay-ui = { path = "crates/relay-ui", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"] }
security-framework = "=3.7.0"

# Keep Inspector controls clickable while selecting an element; see vendor/README.md.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = 1

[profile.dev.package.gpui-pre]
opt-level = 2

[profile.dev.package.gpui-component]
opt-level = 2

[profile.release]
lto = "thin"
strip = "debuginfo"
